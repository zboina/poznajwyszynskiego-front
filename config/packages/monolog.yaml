monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - rag # asystent AI: odpowiedzi bez odnośników do źródeł (var/log/asystent-*.log)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # PHP-FPM nie przechwytuje stderr workerów (catch_workers_output = no),
            # więc błędy idą do pliku: var/log/prod-RRRR-MM-DD.log, 14 dni wstecz.
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # Ostrzeżenia asystenta (np. odpowiedź bez [n]) zapisujemy zawsze —
            # „main" (fingers_crossed) zapisałby je tylko przy błędzie w tym samym żądaniu.
            rag:
                type: rotating_file
                path: "%kernel.logs_dir%/asystent.log"
                max_files: 60
                level: warning
                channels: [rag]
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
